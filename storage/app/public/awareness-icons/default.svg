<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#3b82f6" stroke="#1e40af" stroke-width="5"/>
  
  <!-- Light bulb -->
  <g transform="translate(100, 100)">
    <!-- Bulb -->
    <path d="M -20,-40 Q -35,-25 -35,0 Q -35,15 -25,25 L -15,35 L 15,35 L 25,25 Q 35,15 35,0 Q 35,-25 20,-40 Z" 
          fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Filament -->
    <path d="M -10,-30 L -10,-10 M 10,-30 L 10,-10 M 0,-35 L 0,-5" 
          stroke="#f59e0b" stroke-width="2" fill="none"/>
    
    <!-- Base -->
    <rect x="-15" y="35" width="30" height="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" rx="2"/>
    <rect x="-15" y="43" width="30" height="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
    <rect x="-12" y="49" width="24" height="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" rx="1"/>
    
    <!-- Light rays -->
    <g stroke="#fef3c7" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-55" x2="0" y2="-65"/>
      <line x1="35" y1="-35" x2="42" y2="-42"/>
      <line x1="45" y1="0" x2="55" y2="0"/>
      <line x1="-35" y1="-35" x2="-42" y2="-42"/>
      <line x1="-45" y1="0" x2="-55" y2="0"/>
    </g>
  </g>
</svg>
